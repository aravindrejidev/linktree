<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Aravind — App Creator & Web Builder</title>
<meta name="description" content="App Creator & Web Builder crafting next-gen digital products. Browse apps, websites and tools in one place." />
<meta name="theme-color" content="#e4e9f1" id="meta-theme-color" />
<meta property="og:title" content="Aravind — App Creator & Web Builder" />
<meta property="og:description" content="Crafting next-gen digital products. Browse my apps, websites & tools." />
<meta property="og:type" content="website" />

<!-- Apply the saved (or system) theme before first paint so the page never flashes the wrong one -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    var m = document.getElementById('meta-theme-color');
    if (m) m.setAttribute('content', t === 'dark' ? '#1f232b' : '#e4e9f1');
  })();
</script>

<!-- Fonts: Sora (headings, numerals) + Figtree (body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  /* ==================================================================
     SOFT UI (neumorphism)
     One light source (top-left) and one surface colour. Everything is
     moulded out of that surface using three materials only:

       raised  cards, buttons, avatar plate, the active tab
       inset   wells: logo dock, tags, status pill, tab track, stat icons
       accent  primary button, stat ring, small indicator lights

     To re-tune the whole page, change the tokens in :root below.
     ================================================================== */
  :root{
    color-scheme:light;
    --u:1;                                   /* depth scale (smaller on phones) */

    /* surface */
    --bg:#e4e9f1;
    --hi:#f3f6fb;                            /* lit side of a convex surface   */
    --lo:#d6ddea;                            /* shaded side                    */
    --sh-d:rgba(146,160,190,.62);            /* shadow, away from the light    */
    --sh-l:rgba(255,255,255,.95);            /* highlight, toward the light    */
    --rim:rgba(255,255,255,.42);             /* hairline catching the light    */
    --img-in:inset 7px 7px 16px rgba(26,36,66,.4), inset -3px -3px 8px rgba(255,255,255,.1);

    /* text */
    --ink:#28304a;
    --ink-2:#566079;

    /* accent */
    --accent-ink:#4a3ddb;                    /* accent used as text / icon colour */
    --btn-a:#6a5af0;
    --btn-b:#4c3cd9;
    --on-accent:#ffffff;
    --gloss:inset 0 1px 0 rgba(255,255,255,.3);

    /* small signal lights */
    --cyan:#16b4cc; --violet:#7a5cff; --magenta:#e5488e; --amber:#f0a31f; --green:#22c55e;

    --font-display:'Sora','Segoe UI',system-ui,sans-serif;
    --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
    --gap:clamp(24px,3.4vw,40px);
    --pad:clamp(20px,4vw,36px);

    /* raised */
    --r-xs:calc(3px * var(--u)) calc(3px * var(--u)) calc(7px * var(--u)) var(--sh-d),
           calc(-3px * var(--u)) calc(-3px * var(--u)) calc(7px * var(--u)) var(--sh-l);
    --r-sm:calc(5px * var(--u)) calc(5px * var(--u)) calc(12px * var(--u)) var(--sh-d),
           calc(-5px * var(--u)) calc(-5px * var(--u)) calc(12px * var(--u)) var(--sh-l);
    --r-md:calc(8px * var(--u)) calc(8px * var(--u)) calc(18px * var(--u)) var(--sh-d),
           calc(-8px * var(--u)) calc(-8px * var(--u)) calc(18px * var(--u)) var(--sh-l);
    --r-lg:calc(12px * var(--u)) calc(12px * var(--u)) calc(28px * var(--u)) var(--sh-d),
           calc(-12px * var(--u)) calc(-12px * var(--u)) calc(28px * var(--u)) var(--sh-l);
    /* inset */
    --i-xs:inset calc(3px * var(--u)) calc(3px * var(--u)) calc(6px * var(--u)) var(--sh-d),
           inset calc(-3px * var(--u)) calc(-3px * var(--u)) calc(6px * var(--u)) var(--sh-l);
    --i-sm:inset calc(4px * var(--u)) calc(4px * var(--u)) calc(9px * var(--u)) var(--sh-d),
           inset calc(-4px * var(--u)) calc(-4px * var(--u)) calc(9px * var(--u)) var(--sh-l);
    --i-md:inset calc(7px * var(--u)) calc(7px * var(--u)) calc(15px * var(--u)) var(--sh-d),
           inset calc(-7px * var(--u)) calc(-7px * var(--u)) calc(15px * var(--u)) var(--sh-l);
    /* "flat" with the same shape as --r-*, so a press can animate smoothly */
    --r-none:0 0 0 0 transparent, 0 0 0 0 transparent;
  }

  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1f232b;
    --hi:#282d37;
    --lo:#181b21;
    --sh-d:rgba(5,7,11,.72);
    --sh-l:rgba(255,255,255,.07);
    --rim:rgba(255,255,255,.05);
    --img-in:inset 7px 7px 16px rgba(0,0,0,.65), inset -3px -3px 8px rgba(255,255,255,.05);
    --ink:#e9edf5;
    --ink-2:#a3adc2;
    --accent-ink:#b0a6ff;
    --gloss:inset 0 1px 0 rgba(255,255,255,.22);
  }

  @media (max-width:560px){
    :root{ --u:.72; }
  }

  /* ---------- base ---------- */
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; background:var(--bg); }
  html,body{ max-width:100%; overflow-x:hidden; }
  body{
    margin:0; min-height:100vh;
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    opacity:0; animation:pageIn .5s ease forwards;
  }
  @keyframes pageIn{ from{ opacity:0 } to{ opacity:1 } }

  h1,h2,h3,p,ul{ margin:0; padding:0; }
  ul{ list-style:none; }
  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  img{ display:block; max-width:100%; }
  .hidden{ display:none !important; }
  .sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  .ico{ width:1.15em; height:1.15em; flex:none; }
  ::selection{ background:rgba(106,90,240,.28); }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--sh-d); border-radius:999px; border:2px solid transparent; background-clip:content-box; }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

  a:focus-visible, button:focus-visible{ outline:3px solid var(--accent-ink); outline-offset:3px; }

  /* Colour/shadow swaps must not animate half-way while the theme changes */
  .theme-switching *, .theme-switching *::before, .theme-switching *::after{ transition:none !important; }

  /* ---------- pressable surfaces: raised -> pushed-in on press ---------- */
  .press{ position:relative; -webkit-tap-highlight-color:transparent; transition:box-shadow .24s ease, transform .24s ease, color .24s ease; }
  .press::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; box-shadow:var(--i-sm); transition:opacity .24s ease; }
  @media (hover:hover){ .press:hover{ transform:translateY(-2px); } }
  .press:active{ box-shadow:var(--r-none); transform:translateY(0); }
  .press:active::after{ opacity:1; }

  /* ---------- layout ---------- */
  .wrap{ position:relative; max-width:1080px; margin:0 auto; padding-left:max(var(--pad),env(safe-area-inset-left)); padding-right:max(var(--pad),env(safe-area-inset-right)); }

  /* ---------- theme switch ---------- */
  .theme-btn{
    position:absolute; z-index:2; top:clamp(18px,3vw,30px); right:max(var(--pad),env(safe-area-inset-right));
    width:46px; height:46px; border-radius:50%; display:grid; place-items:center;
    color:var(--ink-2);
    background:linear-gradient(145deg,var(--hi),var(--lo));
    box-shadow:var(--r-sm);
  }
  .theme-btn .ico{ width:20px; height:20px; }
  .theme-btn .i-sun{ display:none; }
  :root[data-theme="dark"] .theme-btn .i-sun{ display:block; }
  :root[data-theme="dark"] .theme-btn .i-moon{ display:none; }

  /* ---------- hero ---------- */
  .hero{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding-top:clamp(68px,10vw,108px); margin-bottom:clamp(44px,6vw,68px);
  }

  /* the avatar is a knob: a raised plate with a dished well */
  .dial{
    --s:clamp(128px,34vw,156px);
    width:var(--s); height:var(--s); padding:calc(var(--s) * .125);
    border-radius:50%; margin-bottom:32px;
    background:conic-gradient(from 200deg, var(--hi), var(--bg) 24%, var(--hi) 50%, var(--bg) 76%, var(--hi));
    border:1px solid var(--rim);
    box-shadow:var(--r-lg);
  }
  .dial-well{ position:relative; width:100%; height:100%; border-radius:50%; overflow:hidden; background:var(--bg); }
  .dial-well::after{ content:""; position:absolute; inset:0; border-radius:50%; box-shadow:var(--img-in); pointer-events:none; }
  .dial-img{ width:100%; height:100%; object-fit:cover; }
  .dial-fallback{ width:100%; height:100%; align-items:center; justify-content:center; color:var(--accent-ink); }
  .dial-fallback .ico{ width:38%; height:38%; }

  .hero-name{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(2.1rem,1.55rem + 2.6vw,3.2rem); line-height:1.08; letter-spacing:-.03em;
    text-shadow:0 1.5px 0 var(--sh-l);
  }
  .hero-handle{ margin-top:8px; font-size:.95rem; font-weight:500; color:var(--ink-2); }
  .hero-tagline{ margin-top:22px; max-width:32rem; }
  .hero-role{ display:block; font-family:var(--font-display); font-weight:600; font-size:clamp(1.05rem,.95rem + .6vw,1.3rem); line-height:1.35; letter-spacing:-.01em; }
  .hero-sub{ display:block; margin-top:6px; color:var(--ink-2); font-size:1rem; text-wrap:balance; }

  .status{
    margin-top:26px; display:inline-flex; align-items:center; gap:11px; max-width:100%;
    padding:11px 22px 11px 18px; border-radius:26px; text-align:left;
    font-size:.9rem; font-weight:600; line-height:1.3; color:var(--ink-2);
    box-shadow:var(--i-sm);
  }
  #profile-status-text{ text-wrap:balance; }
  .led{
    flex:none; width:10px; height:10px; border-radius:50%; background:var(--led,var(--green));
    box-shadow:0 0 10px var(--led,var(--green));
    box-shadow:0 0 0 4px color-mix(in srgb, var(--led,var(--green)) 16%, transparent), 0 0 12px var(--led,var(--green));
    animation:breathe 3s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ opacity:1 } 50%{ opacity:.5 } }

  .socials{ display:flex; gap:18px; margin-top:30px; }
  .social{
    width:50px; height:50px; border-radius:50%; display:grid; place-items:center;
    color:var(--ink-2);
    background:linear-gradient(145deg,var(--hi),var(--lo));
    box-shadow:var(--r-md);
  }
  .social .ico{ width:20px; height:20px; }
  .social-glyph{ font-family:var(--font-display); font-weight:700; font-size:1.1rem; line-height:1; }
  @media (hover:hover){
    .social-x:hover{ color:var(--ink); }
    .social-reddit:hover{ color:#ff5a1f; }
    .social-instagram:hover{ color:#e1306c; }
  }

  /* ---------- filter: an inset track with a raised thumb that slides ---------- */
  .filters{ display:flex; overflow-x:auto; padding:6px 0 30px; }
  .seg{
    position:relative; display:flex; flex:none; gap:2px; margin:0 auto; padding:6px;
    border-radius:24px; overflow:hidden; box-shadow:var(--i-md);
  }
  .seg-thumb{
    position:absolute; top:6px; left:0; height:calc(100% - 12px);
    width:var(--w,0px); transform:translateX(var(--x,0px));
    border-radius:18px; pointer-events:none;
    background:linear-gradient(145deg,var(--hi),var(--lo));
    box-shadow:var(--r-sm);
  }
  .seg.ready .seg-thumb{ transition:transform .42s cubic-bezier(.34,1.32,.5,1), width .42s cubic-bezier(.34,1.32,.5,1); }
  .seg-btn{
    position:relative; z-index:1; display:inline-flex; align-items:center; gap:8px;
    padding:13px 20px; border-radius:18px; white-space:nowrap;
    font-size:.92rem; font-weight:600; line-height:1; color:var(--ink-2);
    transition:color .25s ease; -webkit-tap-highlight-color:transparent;
  }
  .seg-btn:hover{ color:var(--ink); }
  .seg-btn.tab-active{ color:var(--accent-ink); }
  .seg-btn:focus-visible{ outline-offset:-4px; }
  .lbl-short{ display:none; }

  /* ---------- project cards ---------- */
  .grid{ display:flex; flex-wrap:wrap; justify-content:center; gap:var(--gap); }
  .project-card{ display:flex; flex:0 1 100%; transition:opacity .3s ease, transform .3s ease; }

  .card{
    flex:1; min-width:0; display:flex; flex-direction:column;
    padding:clamp(24px,3vw,34px); border-radius:32px;
    background:var(--bg); border:1px solid var(--rim);
    box-shadow:var(--r-lg);
  }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:26px; }

  .logo-well{ width:84px; height:84px; padding:10px; border-radius:26px; box-shadow:var(--i-md); }
  .logo-img, .logo-fallback{ width:100%; height:100%; border-radius:17px; }
  .logo-img{ object-fit:cover; box-shadow:var(--r-xs); }
  .logo-fallback{ align-items:center; justify-content:center; color:var(--tint,var(--accent-ink)); background:linear-gradient(145deg,var(--hi),var(--lo)); box-shadow:var(--r-xs); }
  .logo-fallback .ico{ width:34px; height:34px; }

  .chip{
    display:inline-flex; align-items:center; gap:7px; padding:8px 14px 8px 12px; border-radius:999px;
    font-size:.8rem; font-weight:600; line-height:1.2; color:var(--ink-2); white-space:nowrap;
    box-shadow:var(--i-xs);
  }
  .chip .ico{ width:15px; height:15px; color:var(--accent-ink); }

  .card-title{ font-family:var(--font-display); font-weight:600; font-size:clamp(1.55rem,1.3rem + 1vw,1.95rem); line-height:1.15; letter-spacing:-.025em; margin-bottom:12px; }
  .card-desc{ color:var(--ink-2); font-size:1rem; line-height:1.7; max-width:46ch; margin-bottom:24px; }

  .tags{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:30px; }
  .tag{
    display:inline-flex; align-items:center; gap:9px; padding:8px 15px; border-radius:999px;
    font-size:.82rem; font-weight:600; line-height:1.2; color:var(--ink-2); white-space:nowrap;
    box-shadow:var(--i-xs);
  }
  .tag-dot{ width:7px; height:7px; border-radius:50%; background:var(--dot); box-shadow:0 0 8px var(--dot); }

  .btn{
    margin-top:auto; align-self:flex-start;
    display:inline-flex; align-items:center; gap:10px; padding:14px 22px 14px 24px; border-radius:18px;
    font-weight:700; font-size:.95rem; line-height:1; color:var(--on-accent);
    background:linear-gradient(145deg,var(--btn-a),var(--btn-b));
    box-shadow:var(--r-md), var(--gloss);
  }
  .btn::after{ box-shadow:inset 5px 5px 12px rgba(18,10,76,.5), inset -4px -4px 10px rgba(255,255,255,.18); }
  .btn:active{ box-shadow:var(--r-none), var(--gloss); }
  .btn .ico{ width:17px; height:17px; transition:transform .24s ease; }
  @media (hover:hover){ .btn:hover .ico{ transform:translate(2px,-2px); } }

  .empty{ text-align:center; padding:48px 0 12px; }
  .empty-ico{ width:68px; height:68px; margin:0 auto 18px; border-radius:50%; display:grid; place-items:center; color:var(--ink-2); box-shadow:var(--i-md); }
  .empty-ico .ico{ width:28px; height:28px; }
  .empty p{ color:var(--ink-2); font-size:.95rem; }

  /* ---------- stats ---------- */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:var(--gap); margin-top:var(--gap); }
  .stat{
    display:grid; grid-template-columns:auto auto; justify-content:center; align-items:center; column-gap:22px;
    padding:26px 30px; border-radius:28px;
    background:var(--bg); border:1px solid var(--rim);
    box-shadow:var(--r-md);
  }
  .stat-ico{ position:relative; width:64px; height:64px; border-radius:50%; display:grid; place-items:center; color:var(--accent-ink); box-shadow:var(--i-sm); }
  .stat-ico .ico{ width:24px; height:24px; }
  .stat-num{ font-family:var(--font-display); font-weight:700; font-size:2.25rem; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .stat-label{ margin-top:8px; font-size:.9rem; font-weight:500; color:var(--ink-2); }

  /* the % stat draws its value as a ring around the icon; it fills when the card scrolls into view */
  @property --p{ syntax:'<percentage>'; inherits:false; initial-value:0%; }
  .gauge::before{
    content:""; position:absolute; inset:5px; border-radius:50%;
    background:conic-gradient(var(--btn-a) 0 var(--p), transparent 0);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px));
            mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px));
    filter:drop-shadow(0 0 3px rgba(106,90,240,.55));
    transition:--p 1.2s cubic-bezier(.2,.8,.2,1);
  }
  .stat.is-in .gauge::before{ --p:var(--pct,0%); }

  /* ---------- footer ---------- */
  .foot{ padding-top:52px; padding-bottom:46px; text-align:center; font-size:.86rem; color:var(--ink-2); }
  .foot .led{ display:inline-block; width:7px; height:7px; vertical-align:middle; margin-right:9px; box-shadow:0 0 8px var(--led,var(--green)); animation:none; }

  /* ---------- breakpoints ---------- */
  @media (min-width:561px){ .lbl-short{ display:none; } }
  @media (max-width:560px){
    .lbl-long, .seg-btn .ico{ display:none; }
    .lbl-short{ display:inline; }
    .seg-btn{ padding:13px 16px; }
    .card{ border-radius:28px; }
    .stat{ padding:20px 22px; }
  }
  @media (min-width:720px){
    .project-card{ flex-basis:calc((100% - var(--gap)) / 2); }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
      scroll-behavior:auto !important;
    }
  }
</style>
</head>
<body>

  <main class="wrap">

    <button type="button" id="theme-toggle" class="theme-btn press" aria-label="Switch to dark theme">
      <i data-lucide="moon" class="ico i-moon"></i>
      <i data-lucide="sun" class="ico i-sun"></i>
    </button>

    <!-- ================= PROFILE HEADER (filled in by renderProfile) ================= -->
    <header class="hero">

      <div class="dial">
        <div class="dial-well">
          <img src="images/profile.png" alt="Profile photo" class="dial-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
          <div class="dial-fallback" style="display:none;"><i data-lucide="rocket" class="ico"></i></div>
        </div>
      </div>

      <h1 id="profile-name" class="hero-name"></h1>
      <p id="profile-handle" class="hero-handle"></p>
      <p id="profile-tagline" class="hero-tagline"></p>

      <div id="profile-status" class="status"><span class="led" aria-hidden="true"></span><span id="profile-status-text"></span></div>

      <div class="socials">
        <a id="social-x" href="#" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)"
           class="social social-x press">
          <span class="social-glyph">X</span>
        </a>

        <a id="social-reddit" href="#" target="_blank" rel="noopener noreferrer" aria-label="Reddit"
           class="social social-reddit press">
          <i data-lucide="message-circle" class="ico"></i>
        </a>

        <a id="social-instagram" href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram"
           class="social social-instagram press">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
        </a>
      </div>
    </header>

    <!-- ================= FILTER ================= -->
    <div class="filters no-scrollbar" role="group" aria-label="Filter projects">
      <div class="seg" id="filter-seg">
        <span class="seg-thumb" id="filter-thumb" aria-hidden="true"></span>
        <button type="button" data-filter="all" aria-pressed="true" class="filter-btn seg-btn tab-active"><i data-lucide="layout-grid" class="ico"></i><span class="lbl-long">All Projects</span><span class="lbl-short">All</span></button>
        <button type="button" data-filter="apps" aria-pressed="false" class="filter-btn seg-btn"><i data-lucide="smartphone" class="ico"></i>Apps</button>
        <button type="button" data-filter="websites" aria-pressed="false" class="filter-btn seg-btn"><i data-lucide="globe" class="ico"></i>Websites</button>
        <button type="button" data-filter="tools" aria-pressed="false" class="filter-btn seg-btn"><i data-lucide="wrench" class="ico"></i>Tools</button>
      </div>
    </div>

    <!-- ================= PROJECTS (filled in by renderProjects) ================= -->
    <h2 class="sr-only">Projects</h2>
    <div id="bento-grid" class="grid"></div>

    <!-- Empty state, shown by JS when a filter matches nothing yet -->
    <div id="empty-state" class="empty hidden" role="status">
      <div class="empty-ico"><i data-lucide="inbox" class="ico"></i></div>
      <p>Nothing in this category yet — more projects landing soon.</p>
    </div>

    <!-- ================= QUICK STATS ================= -->
    <div class="stats">
      <div class="stat">
        <div class="stat-ico"><i data-lucide="rocket" class="ico"></i></div>
        <div>
          <p class="stat-num"><span id="project-count-stat" data-count-to="0">0</span></p>
          <p class="stat-label">Projects Shipped</p>
        </div>
      </div>
      <div class="stat">
        <div class="stat-ico gauge" id="open-source-gauge"><i data-lucide="git-branch" class="ico"></i></div>
        <div>
          <p class="stat-num"><span id="open-source-stat" data-count-to="100">0</span>%</p>
          <p class="stat-label">Free &amp; Open Source</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="wrap foot">
    <p>
      <span class="led" aria-hidden="true"></span>All systems nominal — built with late nights and coffee, 2026
    </p>
  </footer>

  <!-- ================= SITE DATA ================= -->
  <!-- This is the ONLY block the admin panel edits. Everything above renders from it. -->
  <script id="site-data" type="application/json">
{
  "profile": {
    "name": "Aravind",
    "handle": "@aravind_3000",
    "tagline": "App Creator & Web Builder | Crafting Next-Gen Digital Products 🚀",
    "status": "🟢 Currently Building Something Cool",
    "socials": {
      "x": "https://x.com/Aravind_3000",
      "reddit": "https://www.reddit.com/u/gh9aravind_3000/s/VSYQ1NAKld",
      "instagram": "https://www.instagram.com/gh9aravind_3000?stkn=MWtxdWNvaGU2YXhvMg=="
    }
  },
  "projects": [
    {
      "name": "TelDrive",
      "category": "apps",
      "description": "Uses a Telegram bot as unlimited cloud storage, with per-folder Sync Links that auto-backup in the background.",
      "tags": ["Flutter", "Telegram API", "SQLite"],

  "stats": {

  </script>

  <script>
    /* Leading coloured-circle emoji in "status" becomes the colour of the status light */
    var LED_COLORS = {
      '\u{1F7E2}': '#22c55e', /* green  */
      '\u{1F7E1}': '#f5b82e', /* yellow */
      '\u{1F7E0}': '#fb923c', /* orange */
      '\u{1F534}': '#ef4444', /* red    */
      '\u{1F535}': '#3b82f6', /* blue   */
      '\u{1F7E3}': '#a855f7', /* purple */
      '⚪':    '#cbd5e1', /* white  */
      '⚫':    '#64748b'  /* black  */
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderProfile(profile) {
      profile = profile || {};
      var nameEl = document.getElementById('profile-name');
      var handleEl = document.getElementById('profile-handle');
      var taglineEl = document.getElementById('profile-tagline');
      var statusEl = document.getElementById('profile-status');
      var statusTextEl = document.getElementById('profile-status-text');
      if (nameEl) nameEl.textContent = profile.name || '';
      if (handleEl) handleEl.textContent = profile.handle || '';

      /* "Role | Supporting line" is shown as two lines; without a "|" it stays one line */
      if (taglineEl) {
        taglineEl.textContent = '';
        var parts = String(profile.tagline || '').split('|');
        var role = parts.shift().trim();
        var rest = parts.join('|').trim();
        if (role) {
          var roleEl = document.createElement('span');
          roleEl.className = 'hero-role';
          roleEl.textContent = role;
          taglineEl.appendChild(roleEl);
        }
        if (rest) {
          var subEl = document.createElement('span');
          subEl.className = 'hero-sub';
          subEl.textContent = rest;
          taglineEl.appendChild(subEl);
        }
      }

      if (statusEl && statusTextEl) {
        var status = String(profile.status || '').trim();
        var first = Array.from(status)[0];
        if (first && Object.prototype.hasOwnProperty.call(LED_COLORS, first)) {
          statusEl.style.setProperty('--led', LED_COLORS[first]);
          status = status.slice(first.length).replace(/^️/, '').trim();
        }
        statusTextEl.textContent = status;
        statusEl.classList.toggle('hidden', !status);
      }

      var socials = profile.socials || {};
      var xEl = document.getElementById('social-x');
      var redditEl = document.getElementById('social-reddit');
      var igEl = document.getElementById('social-instagram');
      if (xEl && socials.x) xEl.href = socials.x;
      if (redditEl && socials.reddit) redditEl.href = socials.reddit;
      if (igEl && socials.instagram) igEl.href = socials.instagram;

      if (profile.name) document.title = profile.name + ' — App Creator & Web Builder';
    }

    function renderProjects(projects) {
      projects = projects || [];
      var TINTS = ['var(--cyan)', 'var(--violet)', 'var(--magenta)', 'var(--amber)'];
      var CATS = {
        apps:     { icon: 'smartphone', label: 'App' },
        websites: { icon: 'globe',      label: 'Website' },
        tools:    { icon: 'wrench',     label: 'Tool' }
      };

      var grid = document.getElementById('bento-grid');
      if (!grid) return;

      var html = projects.map(function (p, i) {
        var tint = TINTS[i % TINTS.length];
        var icon = escapeHtml(p.icon || 'box');
        var catKey = p.category || 'apps';
        var cat = Object.prototype.hasOwnProperty.call(CATS, catKey) ? CATS[catKey] : { icon: 'box', label: String(catKey) };
        var tagsHtml = (p.tags || []).map(function (tag, ti) {
          return '<li class="tag"><span class="tag-dot" style="--dot:' + TINTS[ti % TINTS.length] + ';"></span>' + escapeHtml(tag) + '</li>';
        }).join('');

        return (
          '<article class="project-card" data-category="' + escapeHtml(catKey) + '">' +
            '<div class="card">' +
              '<div class="card-top">' +
                '<div class="logo-well">' +
                  '<img src="' + escapeHtml(p.logo || '') + '" alt="' + escapeHtml(p.name || '') + ' logo" class="logo-img" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';" />' +
                  '<div class="logo-fallback" style="display:none; --tint:' + tint + ';"><i data-lucide="' + icon + '" class="ico"></i></div>' +
                '</div>' +
                '<span class="chip"><i data-lucide="' + escapeHtml(cat.icon) + '" class="ico"></i>' + escapeHtml(cat.label) + '</span>' +
              '</div>' +
              '<h3 class="card-title">' + escapeHtml(p.name || '') + '</h3>' +
              '<p class="card-desc">' + escapeHtml(p.description || '') + '</p>' +
              '<ul class="tags">' + tagsHtml + '</ul>' +
              '<a href="' + escapeHtml(p.link || '#') + '" target="_blank" rel="noopener noreferrer" class="btn press">' +
                '<span>' + escapeHtml(p.linkText || 'View Project') + '</span><i data-lucide="arrow-up-right" class="ico"></i>' +
              '</a>' +
            '</div>' +
          '</article>'
        );
      }).join('');

      grid.innerHTML = html;
    }

    /* ---------- Load data & render the page ---------- */
    var DATA = JSON.parse(document.getElementById('site-data').textContent);
    renderProfile(DATA.profile);
    renderProjects(DATA.projects);

    /* Icons must init AFTER the dynamic content above exists in the DOM */
    if (window.lucide && lucide.createIcons) lucide.createIcons();

    var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- Theme switch ---------- */
    var rootEl = document.documentElement;
    var themeBtn = document.getElementById('theme-toggle');
    var metaTheme = document.getElementById('meta-theme-color');

    function setTheme(theme, save) {
      rootEl.classList.add('theme-switching');
      rootEl.setAttribute('data-theme', theme);
      if (metaTheme) metaTheme.setAttribute('content', theme === 'dark' ? '#1f232b' : '#e4e9f1');
      if (themeBtn) themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
      if (save) { try { localStorage.setItem('theme', theme); } catch (e) {} }
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { rootEl.classList.remove('theme-switching'); });
      });
    }
    setTheme(rootEl.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false);
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        setTheme(rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
      });
    }

    /* Stats driven straight from the data — never go stale */
    var projectCountEl = document.getElementById('project-count-stat');
    if (projectCountEl) projectCountEl.setAttribute('data-count-to', DATA.projects.length);
    var openSourceEl = document.getElementById('open-source-stat');
    var openSourcePct = 100;
    if (DATA.stats && DATA.stats.openSourcePercent != null) openSourcePct = Math.max(0, Math.min(100, Number(DATA.stats.openSourcePercent) || 0));
    if (openSourceEl) openSourceEl.setAttribute('data-count-to', openSourcePct);
    var gaugeEl = document.getElementById('open-source-gauge');
    if (gaugeEl) gaugeEl.style.setProperty('--pct', openSourcePct + '%');

    /* ---------- Filter tabs ---------- */
    var filterBtns = document.querySelectorAll('.filter-btn');
    var projectCards = document.querySelectorAll('.project-card[data-category]');
    var emptyState = document.getElementById('empty-state');
    var seg = document.getElementById('filter-seg');
    var filtersBar = seg ? seg.parentNode : null;

    /* The raised thumb sits under whichever tab is active */
    function placeThumb(instant) {
      if (!seg) return;
      var active = seg.querySelector('.filter-btn.tab-active');
      if (!active) return;
      if (instant) seg.classList.remove('ready');
      seg.style.setProperty('--x', active.offsetLeft + 'px');
      seg.style.setProperty('--w', active.offsetWidth + 'px');
      if (instant) { void seg.offsetWidth; seg.classList.add('ready'); }
    }
    placeThumb(false);
    requestAnimationFrame(function () { if (seg) seg.classList.add('ready'); });
    /* Re-measure whenever the tabs change size (web font arrives, rotate, zoom, resize) */
    if (window.ResizeObserver && seg) {
      var thumbObserver = new ResizeObserver(function () { placeThumb(true); });
      thumbObserver.observe(seg);
      filterBtns.forEach(function (b) { thumbObserver.observe(b); });
    } else {
      window.addEventListener('resize', function () { placeThumb(true); });
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { placeThumb(true); });

    if (emptyState && projectCards.length === 0) emptyState.classList.remove('hidden');

    filterBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        filterBtns.forEach(function (b) {
          b.classList.remove('tab-active');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('tab-active');
        btn.setAttribute('aria-pressed', 'true');
        placeThumb(false);
        if (filtersBar && filtersBar.scrollWidth > filtersBar.clientWidth) {
          btn.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
        }

        var filter = btn.getAttribute('data-filter');
        var anyMatch = false;

        projectCards.forEach(function (card) {
          var isMatch = filter === 'all' || card.getAttribute('data-category') === filter;
          if (isMatch) anyMatch = true;
          clearTimeout(card._hideTimeout);
          if (isMatch) {
            card.style.display = '';
            void card.offsetWidth; /* force reflow so the transition plays */
            card.style.opacity = '1';
            card.style.transform = 'scale(1)';
          } else {
            card.style.opacity = '0';
            card.style.transform = 'scale(0.94)';
            card._hideTimeout = setTimeout(function () { card.style.display = 'none'; }, 300);
          }
        });

        if (emptyState) emptyState.classList.toggle('hidden', anyMatch);
      });
    });

    /* ---------- Count-up stats (the ring fills when its card scrolls into view) ---------- */
    var counters = document.querySelectorAll('[data-count-to]');

    function animateCounter(el) {
      var card = el.closest('.stat');
      if (card) card.classList.add('is-in');
      var target = parseInt(el.getAttribute('data-count-to'), 10);
      if (prefersReducedMotion) {
        el.textContent = target;
        return;
      }
      var duration = 1100;
      var startTime = null;
      function tick(now) {
        if (!startTime) startTime = now;
        var progress = Math.min((now - startTime) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(eased * target);
        if (progress < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    if ('IntersectionObserver' in window) {
      var counterObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            animateCounter(entry.target);
            counterObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.4 });
      counters.forEach(function (el) { counterObserver.observe(el); });
    } else {
      counters.forEach(function (el) { animateCounter(el); });
    }
  </script>
