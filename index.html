<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Aravind — App Creator & Web Builder</title>
<meta name="description" content="App Creator & Web Builder crafting next-gen digital products. Browse apps, websites and tools in one place." />
<meta name="theme-color" content="#e4e9f1" id="meta-theme-color" />
<meta property="og:title" content="Aravind — App Creator & Web Builder" />
<meta property="og:description" content="Crafting next-gen digital products. Browse my apps, websites & tools." />
<meta property="og:type" content="website" />

<!-- Apply the saved (or system) theme before first paint so the page never flashes the wrong one -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    var m = document.getElementById('meta-theme-color');
    if (m) m.setAttribute('content', t === 'dark' ? '#1f232b' : '#e4e9f1');
  })();
</script>

<!-- The project list comes from Google Apps Script: open the connection early -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

<!-- Fonts: Sora (headings, numerals) + Figtree (body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  /* ==================================================================
     SOFT UI (neumorphism)
     One light source (top-left) and one surface colour. Everything is
     moulded out of that surface using three materials only:

       raised  cards, buttons, avatar plate, the active tab
       inset   wells: logo dock, tags, status pill, tab track, stat icons
       accent  primary button, stat ring, small indicator lights

     To re-tune the whole page, change the tokens in :root below.
     ================================================================== */
  :root{
    color-scheme:light;
    --u:1;                                   /* depth scale (smaller on phones) */

    /* surface */
    --bg:#e4e9f1;
    --hi:#f3f6fb;                            /* lit side of a convex surface   */
    --lo:#d6ddea;                            /* shaded side                    */
    --sh-d:rgba(146,160,190,.62);            /* shadow, away from the light    */
    --sh-l:rgba(255,255,255,.95);            /* highlight, toward the light    */
    --rim:rgba(255,255,255,.42);             /* hairline catching the light    */
    --img-in:inset 7px 7px 16px rgba(26,36,66,.4), inset -3px -3px 8px rgba(255,255,255,.1);

    /* text */
    --ink:#28304a;
    --ink-2:#566079;

    /* accent */
    --accent-ink:#4a3ddb;                    /* accent used as text / icon colour */
    --btn-a:#6a5af0;
    --btn-b:#4c3cd9;
    --on-accent:#ffffff;
    --gloss:inset 0 1px 0 rgba(255,255,255,.3);

    /* small signal lights */
    --cyan:#16b4cc; --violet:#7a5cff; --magenta:#e5488e; --amber:#f0a31f; --green:#22c55e;

    --font-display:'Sora','Segoe UI',system-ui,sans-serif;
    --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
    --gap:clamp(24px,3.4vw,40px);
    --pad:clamp(20px,4vw,36px);

    /* raised */
    --r-xs:calc(3px * var(--u)) calc(3px * var(--u)) calc(7px * var(--u)) var(--sh-d),
           calc(-3px * var(--u)) calc(-3px * var(--u)) calc(7px * var(--u)) var(--sh-l);
    --r-sm:calc(5px * var(--u)) calc(5px * var(--u)) calc(12px * var(--u)) var(--sh-d),
           calc(-5px * var(--u)) calc(-5px * var(--u)) calc(12px * var(--u)) var(--sh-l);
    --r-md:calc(8px * var(--u)) calc(8px * var(--u)) calc(18px * var(--u)) var(--sh-d),
           calc(-8px * var(--u)) calc(-8px * var(--u)) calc(18px * var(--u)) var(--sh-l);
    --r-lg:calc(12px * var(--u)) calc(12px * var(--u)) calc(28px * var(--u)) var(--sh-d),
           calc(-12px * var(--u)) calc(-12px * var(--u)) calc(28px * var(--u)) var(--sh-l);
    /* inset */
    --i-xs:inset calc(3px * var(--u)) calc(3px * var(--u)) calc(6px * var(--u)) var(--sh-d),
           inset calc(-3px * var(--u)) calc(-3px * var(--u)) calc(6px * var(--u)) var(--sh-l);
    --i-sm:inset calc(4px * var(--u)) calc(4px * var(--u)) calc(9px * var(--u)) var(--sh-d),
           inset calc(-4px * var(--u)) calc(-4px * var(--u)) calc(9px * var(--u)) var(--sh-l);
    --i-md:inset calc(7px * var(--u)) calc(7px * var(--u)) calc(15px * var(--u)) var(--sh-d),
           inset calc(-7px * var(--u)) calc(-7px * var(--u)) calc(15px * var(--u)) var(--sh-l);
    /* "flat" with the same shape as --r-*, so a press can animate smoothly */
    --r-none:0 0 0 0 transparent, 0 0 0 0 transparent;
  }

  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1f232b;
    --hi:#282d37;
    --lo:#181b21;
    --sh-d:rgba(5,7,11,.72);
    --sh-l:rgba(255,255,255,.07);
    --rim:rgba(255,255,255,.05);
    --img-in:inset 7px 7px 16px rgba(0,0,0,.65), inset -3px -3px 8px rgba(255,255,255,.05);
    --ink:#e9edf5;
    --ink-2:#a3adc2;
    --accent-ink:#b0a6ff;
    --gloss:inset 0 1px 0 rgba(255,255,255,.22);
  }

  @media (max-width:560px){
    :root{ --u:.72; }
  }

  /* ---------- base ---------- */
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; background:var(--bg); }
  html,body{ max-width:100%; overflow-x:hidden; }
  body{
    margin:0; min-height:100vh;
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    opacity:0; animation:pageIn .5s ease forwards;
  }
  @keyframes pageIn{ from{ opacity:0 } to{ opacity:1 } }

  h1,h2,h3,p,ul{ margin:0; padding:0; }
  ul{ list-style:none; }
  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  img{ display:block; max-width:100%; }
  .hidden{ display:none !important; }
  .sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  .ico{ width:1.15em; height:1.15em; flex:none; }
  ::selection{ background:rgba(106,90,240,.28); }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--sh-d); border-radius:999px; border:2px solid transparent; background-clip:content-box; }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

  a:focus-visible, button:focus-visible{ outline:3px solid var(--accent-ink); outline-offset:3px; }

  /* Colour/shadow swaps must not animate half-way while the theme changes */
  .theme-switching *, .theme-switching *::before, .theme-switching *::after{ transition:none !important; }

  /* ---------- pressable surfaces: raised -> pushed-in on press ---------- */
  .press{ position:relative; -webkit-tap-highlight-color:transparent; transition:box-shadow .24s ease, transform .24s ease, color .24s ease; }
  .press::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; box-shadow:var(--i-sm); transition:opacity .24s ease; }
  @media (hover:hover){ .press:hover{ transform:translateY(-2px); } }
  .press:active{ box-shadow:var(--r-none); transform:translateY(0); }
  .press:active::after{ opacity:1; }

  /* ---------- layout ---------- */
  .wrap{ position:relative; max-width:1080px; margin:0 auto; padding-left:max(var(--pad),env(safe-area-inset-left)); padding-right:max(var(--pad),env(safe-area-inset-right)); }

  /* ---------- theme switch ---------- */
  .theme-btn{
    position:absolute; z-index:2; top:clamp(18px,3vw,30px); right:max(var(--pad),env(safe-area-inset-right));
    width:46px; height:46px; border-radius:50%; display:grid; place-items:center;
    color:var(--ink-2);
    background:linear-gradient(145deg,var(--hi),var(--lo));
    box-shadow:var(--r-sm);
  }
  .theme-btn .ico{ width:20px; height:20px; }
  .theme-btn .i-sun{ display:none; }
  :root[data-theme="dark"] .theme-btn .i-sun{ display:block; }
  :root[data-theme="dark"] .theme-btn .i-moon{ display:none; }

  /* ---------- hero ---------- */
  .hero{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding-top:clamp(68px,10vw,108px); margin-bottom:clamp(44px,6vw,68px);
  }

  /* the avatar is a knob: a raised plate with a dished well */
  .dial{
    --s:clamp(128px,34vw,156px);
    width:var(--s); height:var(--s); padding:calc(var(--s) * .125);
    border-radius:50%; margin-bottom:32px;
    background:conic-gradient(from 200deg, var(--hi), var(--bg) 24%, var(--hi) 50%, var(--bg) 76%, var(--hi));
    border:1px solid var(--rim);
    box-shadow:var(--r-lg);
  }
  .dial-well{ position:relative; width:100%; height:100%; border-radius:50%; overflow:hidden; background:var(--bg); }
  .dial-well::after{ content:""; position:absolute; inset:0; border-radius:50%; box-shadow:var(--img-in); pointer-events:none; }
  .dial-img{ width:100%; height:100%; object-fit:cover; }
  .dial-fallback{ width:100%; height:100%; align-items:center; justify-content:center; color:var(--accent-ink); }
  .dial-fallback .ico{ width:38%; height:38%; }

  .hero-name{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(2.1rem,1.55rem + 2.6vw,3.2rem); line-height:1.08; letter-spacing:-.03em;
    text-shadow:0 1.5px 0 var(--sh-l);
  }
  .hero-handle{ margin-top:8px; font-size:.95rem; font-weight:500; color:var(--ink-2); }
  .hero-tagline{ margin-top:22px; max-width:32rem; }
  .hero-role{ display:block; font-family:var(--font-display); font-weight:600; font-size:clamp(1.05rem,.95rem + .6vw,1.3rem); line-height:1.35; letter-spacing:-.01em; }
  .hero-sub{ display:block; margin-top:6px; color:var(--ink-2); font-size:1rem; text-wrap:balance; }

  .status{
    margin-top:26px; display:inline-flex; align-items:center; gap:11px; max-width:100%;
    padding:11px 22px 11px 18px; border-radius:26px; text-align:left;
    font-size:.9rem; font-weight:600; line-height:1.3; color:var(--ink-2);
    box-shadow:var(--i-sm);
  }
  #profile-status-text{ text-wrap:balance; }
  .led{
    flex:none; width:10px; height:10px; border-radius:50%; background:var(--led,var(--green));
    box-shadow:0 0 10px var(--led,var(--green));
    box-shadow:0 0 0 4px color-mix(in srgb, var(--led,var(--green)) 16%, transparent), 0 0 12px var(--led,var(--green));
    animation:breathe 3s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ opacity:1 } 50%{ opacity:.5 } }
  @keyframes pulse-soft{ 0%,100%{ opacity:1 } 50%{ opacity:.62 } }

  .socials{ display:flex; gap:18px; margin-top:30px; }
  .social{
    width:50px; height:50px; border-radius:50%; display:grid; place-items:center;
    color:var(--ink-2);
    background:linear-gradient(145deg,var(--hi),var(--lo));
    box-shadow:var(--r-md);
  }
  .social .ico{ width:20px; height:20px; }
  .social-glyph{ font-family:var(--font-display); font-weight:700; font-size:1.1rem; line-height:1; }
  @media (hover:hover){
    .social-x:hover{ color:var(--ink); }
    .social-reddit:hover{ color:#ff5a1f; }
    .social-instagram:hover{ color:#e1306c; }
  }

  /* ---------- filter: an inset track with a raised thumb that slides ---------- */
  .filters{ display:flex; overflow-x:auto; padding:6px 0 30px; }
  .seg{
    position:relative; display:flex; flex:none; gap:2px; margin:0 auto; padding:6px;
    border-radius:24px; overflow:hidden; box-shadow:var(--i-md);
  }
  .seg-thumb{
    position:absolute; top:6px; left:0; height:calc(100% - 12px);
    width:var(--w,0px); transform:translateX(var(--x,0px));
    border-radius:18px; pointer-events:none;
    background:linear-gradient(145deg,var(--hi),var(--lo));
    box-shadow:var(--r-sm);
  }
  .seg.ready .seg-thumb{ transition:transform .42s cubic-bezier(.34,1.32,.5,1), width .42s cubic-bezier(.34,1.32,.5,1); }
  .seg-btn{
    position:relative; z-index:1; display:inline-flex; align-items:center; gap:8px;
    padding:13px 20px; border-radius:18px; white-space:nowrap;
    font-size:.92rem; font-weight:600; line-height:1; color:var(--ink-2);
    transition:color .25s ease; -webkit-tap-highlight-color:transparent;
  }
  .seg-btn:hover{ color:var(--ink); }
  .seg-btn.tab-active{ color:var(--accent-ink); }
  .seg-btn:focus-visible{ outline-offset:-4px; }
  .lbl-short{ display:none; }

  /* ---------- project cards ---------- */
  .grid{ display:flex; flex-wrap:wrap; justify-content:center; gap:var(--gap); }
  .project-card{ display:flex; flex:0 1 100%; transition:opacity .3s ease, transform .3s ease; }

  .card{
    flex:1; min-width:0; display:flex; flex-direction:column;
    padding:clamp(24px,3vw,34px); border-radius:32px;
    background:var(--bg); border:1px solid var(--rim);
    box-shadow:var(--r-lg);
  }
  .card-top{ display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:26px; }
  .card-meta{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; margin-left:auto; }

  .logo-well{ width:84px; height:84px; padding:10px; border-radius:26px; box-shadow:var(--i-md); }
  .logo-img, .logo-fallback{ width:100%; height:100%; border-radius:17px; }
  .logo-img{ object-fit:cover; box-shadow:var(--r-xs); }
  .logo-fallback{ align-items:center; justify-content:center; color:var(--tint,var(--accent-ink)); background:linear-gradient(145deg,var(--hi),var(--lo)); box-shadow:var(--r-xs); }
  .logo-fallback .ico{ width:34px; height:34px; }

  .chip{
    display:inline-flex; align-items:center; gap:7px; padding:8px 14px 8px 12px; border-radius:999px;
    font-size:.8rem; font-weight:600; line-height:1.2; color:var(--ink-2); white-space:nowrap;
    box-shadow:var(--i-xs);
  }
  .chip .ico{ width:15px; height:15px; color:var(--accent-ink); }
  /* project status: a small indicator light; it only pulses while the project is being built */
  .chip-status{ color:var(--ink); }
  .chip-status .led{
    width:8px; height:8px; animation:none;
    box-shadow:0 0 8px var(--led,var(--green));
    box-shadow:0 0 0 3px color-mix(in srgb, var(--led,var(--green)) 18%, transparent), 0 0 9px var(--led,var(--green));
  }
  .chip-status.is-building .led{ animation:pulse-soft 2.4s ease-in-out infinite; }

  .card-title{ font-family:var(--font-display); font-weight:600; font-size:clamp(1.55rem,1.3rem + 1vw,1.95rem); line-height:1.15; letter-spacing:-.025em; margin-bottom:12px; }
  .card-desc{ color:var(--ink-2); font-size:1rem; line-height:1.7; max-width:46ch; margin-bottom:24px; }

  .tags{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:30px; }
  .tag{
    display:inline-flex; align-items:center; gap:9px; padding:8px 15px; border-radius:999px;
    font-size:.82rem; font-weight:600; line-height:1.2; color:var(--ink-2); white-space:nowrap;
    box-shadow:var(--i-xs);
  }
  .tag-dot{ width:7px; height:7px; border-radius:50%; background:var(--dot); box-shadow:0 0 8px var(--dot); }

  .btn{
    margin-top:auto; align-self:flex-start;
    display:inline-flex; align-items:center; gap:10px; padding:14px 22px 14px 24px; border-radius:18px;
    font-weight:700; font-size:.95rem; line-height:1; color:var(--on-accent);
    background:linear-gradient(145deg,var(--btn-a),var(--btn-b));
    box-shadow:var(--r-md), var(--gloss);
  }
  .btn::after{ box-shadow:inset 5px 5px 12px rgba(18,10,76,.5), inset -4px -4px 10px rgba(255,255,255,.18); }
  .btn:active{ box-shadow:var(--r-none), var(--gloss); }
  .btn .ico{ width:17px; height:17px; transition:transform .24s ease; }
  @media (hover:hover){ .btn:hover .ico{ transform:translate(2px,-2px); } }

  .empty{ text-align:center; padding:48px 0 12px; }
  .empty-ico{ width:68px; height:68px; margin:0 auto 18px; border-radius:50%; display:grid; place-items:center; color:var(--ink-2); box-shadow:var(--i-md); }
  .empty-ico .ico{ width:28px; height:28px; }
  .empty p{ color:var(--ink-2); font-size:.95rem; }

  /* ==================================================================
     DYNAMIC DATA: loading skeleton, notices, error panel
     ================================================================== */
  :root{ --shine:rgba(255,255,255,.62); }
  :root[data-theme="dark"]{ --shine:rgba(255,255,255,.075); }

  /* cards ease in one after another when the list first appears */
  .project-card{ animation:cardIn .55s cubic-bezier(.2,.8,.2,1) backwards; animation-delay:calc(var(--i,0) * 70ms); }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(14px); } }

  .is-bare .card-title{ margin-bottom:28px; }

  /* skeleton: the same card shape, with inset "wells" that shimmer */
  .project-card.is-skeleton{ animation:none; pointer-events:none; }
  .sk{ position:relative; overflow:hidden; border-radius:14px; background:var(--bg); box-shadow:var(--i-xs); }
  .sk::after{
    content:""; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, var(--shine), transparent);
    animation:shimmer 1.7s ease-in-out infinite;
  }
  @keyframes shimmer{ to{ transform:translateX(100%); } }
  .sk-logo{ width:100%; height:100%; border-radius:17px; }
  .sk-chip{ display:block; width:92px; height:34px; border-radius:999px; }
  .sk-chip.wide{ width:132px; }
  .sk-title{ width:56%; height:30px; margin-bottom:16px; }
  .sk-line{ height:14px; width:94%; margin-bottom:12px; }
  .sk-line.short{ width:68%; margin-bottom:26px; }
  .sk-tags{ display:flex; gap:12px; margin-bottom:30px; }
  .sk-tag{ width:84px; height:34px; border-radius:999px; }
  .sk-btn{ width:150px; height:46px; border-radius:18px; margin-top:auto; }

  /* "showing saved list, couldn't refresh" */
  .note{
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px 14px;
    width:fit-content; max-width:100%; margin:0 auto var(--gap); padding:9px 10px 9px 20px; border-radius:28px;
    font-size:.88rem; font-weight:600; line-height:1.3; color:var(--ink-2); box-shadow:var(--i-sm);
  }
  .note-msg{ display:inline-flex; align-items:center; gap:10px; text-align:left; }
  .note-msg .ico{ width:16px; height:16px; color:var(--amber); }
  .note-btn{
    display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:8px 16px; border-radius:18px;
    font-size:.85rem; font-weight:700; color:var(--accent-ink);
    background:linear-gradient(145deg,var(--hi),var(--lo)); box-shadow:var(--r-xs);
  }
  .note-btn .ico{ width:15px; height:15px; }

  /* error panel */
  .state{
    max-width:30rem; margin:0 auto; text-align:center;
    padding:clamp(28px,4vw,40px) clamp(22px,4vw,36px); border-radius:32px;
    background:var(--bg); border:1px solid var(--rim); box-shadow:var(--r-lg);
  }
  .state-ico{ width:68px; height:68px; margin:0 auto 18px; border-radius:50%; display:grid; place-items:center; color:var(--amber); box-shadow:var(--i-md); }
  .state-ico .ico{ width:28px; height:28px; }
  .state h3{ font-family:var(--font-display); font-weight:600; font-size:1.3rem; letter-spacing:-.02em; margin-bottom:8px; }
  .state p{ color:var(--ink-2); font-size:.95rem; line-height:1.6; }
  .state .btn{ display:flex; width:fit-content; margin:26px auto 0; }
  @media (hover:hover){ .state .btn:hover .ico{ transform:none; } }
  .is-loading .ico{ animation:spin .9s linear infinite; }
  .is-loading{ opacity:.7; pointer-events:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .noscript{ text-align:center; color:var(--ink-2); padding:24px 0; }

  /* ---------- stats ---------- */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:var(--gap); margin-top:var(--gap); }
  .stat{
    display:grid; grid-template-columns:auto auto; justify-content:center; align-items:center; column-gap:22px;
    padding:26px 30px; border-radius:28px;
    background:var(--bg); border:1px solid var(--rim);
    box-shadow:var(--r-md);
  }
  .stat-ico{ position:relative; width:64px; height:64px; border-radius:50%; display:grid; place-items:center; color:var(--accent-ink); box-shadow:var(--i-sm); }
  .stat-ico .ico{ width:24px; height:24px; }
  .stat-num{ font-family:var(--font-display); font-weight:700; font-size:2.25rem; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .stat-label{ margin-top:8px; font-size:.9rem; font-weight:500; color:var(--ink-2); }

  /* the % stat draws its value as a ring around the icon; it fills when the card scrolls into view */
  @property --p{ syntax:'<percentage>'; inherits:false; initial-value:0%; }
  .gauge::before{
    content:""; position:absolute; inset:5px; border-radius:50%;

  <script>
    /* ==================================================================
       SETTINGS: the only line you must edit
       ------------------------------------------------------------------
       Paste the web-app URL you get after deploying Code.gs in Google
       Apps Script (it ends with /exec).
       ================================================================== */
    var APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_URL';
    var FETCH_TIMEOUT_MS = 15000;           /* stop waiting after 15 seconds */
    var CACHE_KEY = 'linktree:links:v1';    /* last good list, kept in the browser so repeat visits are instant */

    /* Leading coloured-circle emoji in "status" becomes the colour of the status light */
    var LED_COLORS = {
      '\u{1F7E2}': '#22c55e', /* green  */
      '\u{1F7E1}': '#f5b82e', /* yellow */
      '\u{1F7E0}': '#fb923c', /* orange */
      '\u{1F534}': '#ef4444', /* red    */
      '\u{1F535}': '#3b82f6', /* blue   */
      '\u{1F7E3}': '#a855f7', /* purple */
      '\u26AA':    '#cbd5e1', /* white  */
      '\u26AB':    '#64748b'  /* black  */
    };

    var TONE_COLORS = { live: '#22c55e', building: '#f5b82e', planned: '#94a3b8', info: '#7a5cff' };

    /* Splits a leading coloured-circle emoji (if any) from the text: "(green circle) Live" -> { color, text } */
    function parseLed(raw) {
      var text = String(raw || '').trim();
      var first = Array.from(text)[0];
      var color = null;
      if (first && Object.prototype.hasOwnProperty.call(LED_COLORS, first)) {
        color = LED_COLORS[first];
        text = text.slice(first.length).replace(/^\uFE0F/, '').trim();
      }
      return { text: text, color: color };
    }

    /* Reads what a status means from its words, so plain text like "Apk released" gets the right light */
    function statusTone(text) {
      var t = String(text || '').toLowerCase();
      if (/(not yet|unreleased|not released|coming|upcoming|soon|plan|idea|paused|on hold|archiv)/.test(t)) return 'planned';
      if (/(build|develop|progress|wip|working|beta|alpha|testing)/.test(t)) return 'building';
      if (/(releas|live|launch|ship|stable|available|publish|done|complete)/.test(t)) return 'live';
      return 'info';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderProfile(profile) {
      profile = profile || {};
      var nameEl = document.getElementById('profile-name');
      var handleEl = document.getElementById('profile-handle');
      var taglineEl = document.getElementById('profile-tagline');
      var statusEl = document.getElementById('profile-status');
      var statusTextEl = document.getElementById('profile-status-text');
      if (nameEl) nameEl.textContent = profile.name || '';
      if (handleEl) handleEl.textContent = profile.handle || '';

      /* "Role | Supporting line" is shown as two lines; without a "|" it stays one line */
      if (taglineEl) {
        taglineEl.textContent = '';
        var parts = String(profile.tagline || '').split('|');
        var role = parts.shift().trim();
        var rest = parts.join('|').trim();
        if (role) {
          var roleEl = document.createElement('span');
          roleEl.className = 'hero-role';
          roleEl.textContent = role;
          taglineEl.appendChild(roleEl);
        }
        if (rest) {
          var subEl = document.createElement('span');
          subEl.className = 'hero-sub';
          subEl.textContent = rest;
          taglineEl.appendChild(subEl);
        }
      }

      if (statusEl && statusTextEl) {
        var parsed = parseLed(profile.status);
        if (parsed.color) statusEl.style.setProperty('--led', parsed.color);
        statusTextEl.textContent = parsed.text;
        statusEl.classList.toggle('hidden', !parsed.text);
      }

      var socials = profile.socials || {};
      var xEl = document.getElementById('social-x');
      var redditEl = document.getElementById('social-reddit');
      var igEl = document.getElementById('social-instagram');
      if (xEl && socials.x) xEl.href = socials.x;
      if (redditEl && socials.reddit) redditEl.href = socials.reddit;
      if (igEl && socials.instagram) igEl.href = socials.instagram;

      if (profile.name) document.title = profile.name + ' — App Creator & Web Builder';
    }

    /* ---------- tiny helpers ---------- */
    function $(id) { return document.getElementById(id); }
    function own(obj, key) { return Object.prototype.hasOwnProperty.call(obj, key); }
    function show(el, on) { if (el) el.classList.toggle('hidden', !on); }

    /* text only: control characters out, white space collapsed, length capped */
    function str(value, max) {
      return String(value == null ? '' : value).replace(/[\x00-\x1f\x7f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);
    }

    /* Only web and mail links may become a link. "github.com/x" is repaired; "javascript:" and friends are dropped. */
    function safeHref(raw) {
      var u = str(raw, 500);
      if (!u || /\s/.test(u)) return '';
      if (/^https?:\/\/[^\s\/?#]+/i.test(u)) return u;
      if (/^mailto:[^\s@]+@[^\s@]+$/i.test(u)) return u;
      if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(:\d+)?([\/?#]\S*)?$/i.test(u)) return 'https://' + u;
      return '';
    }
    function safeIcon(raw) {
      var i = str(raw, 40).toLowerCase();
      return /^[a-z0-9]+(-[a-z0-9]+)*$/.test(i) ? i : '';
    }
    function safeLogo(raw) {
      var s = str(raw, 500);
      if (!s || /\s/.test(s) || /[<>"']/.test(s)) return '';
      if (/^https?:\/\/[^\s\/?#]+/i.test(s)) return s;
      if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return '';
      return s;
    }
    function toTags(raw) {
      var list = Array.isArray(raw) ? raw : String(raw == null ? '' : raw).split(',');
      return list.map(function (t) { return str(t, 24); }).filter(Boolean).slice(0, 8);
    }

    /* ---------- categories ---------- */
    var CATS = {
      apps:     { icon: 'smartphone', label: 'App',     plural: 'Apps' },
      websites: { icon: 'globe',      label: 'Website', plural: 'Websites' },
      tools:    { icon: 'wrench',     label: 'Tool',    plural: 'Tools' }
    };
    var CAT_ORDER = ['apps', 'websites', 'tools'];
    var CAT_ALIASES = { app: 'apps', website: 'websites', web: 'websites', site: 'websites', sites: 'websites', tool: 'tools', utility: 'tools', utilities: 'tools' };
    var TINTS = ['var(--cyan)', 'var(--violet)', 'var(--magenta)', 'var(--amber)'];

    function normCategory(raw) {
      var k = str(raw, 30).toLowerCase();
      if (!k) return 'other';
      return own(CAT_ALIASES, k) ? CAT_ALIASES[k] : k;
    }
    function catInfo(key) {
      if (own(CATS, key)) return CATS[key];
      var label = key.charAt(0).toUpperCase() + key.slice(1);
      return { icon: 'box', label: label, plural: label };
    }

    /* One entry from the sheet -> a clean card record (or null if it can't be shown safely) */
    function normalizeLink(raw) {
      if (!raw || typeof raw !== 'object') return null;
      var title = str(raw.title, 80);
      var url = safeHref(raw.url);
      if (!title || !url) return null;
      return {
        title: title,
        url: url,
        category: normCategory(raw.category),
        icon: safeIcon(raw.icon),
        description: str(raw.description, 300),
        tags: toTags(raw.tags),
        status: str(raw.status, 60),
        logo: safeLogo(raw.logo)
      };
    }

    function linkLabel(url) {
      if (/^mailto:/i.test(url)) return 'Send Email';
      var host = '';
      try { host = new URL(url).hostname.replace(/^www\./, '').toLowerCase(); } catch (e) {}
      if (host === 'github.com') return 'View on GitHub';
      if (host === 'play.google.com') return 'Get on Google Play';
      return 'View Project';
    }

    function categoriesOf(links) {
      var seen = {}, list = [];
      links.forEach(function (l) { if (!seen[l.category]) { seen[l.category] = true; list.push(l.category); } });
      list.sort(function (a, b) {
        var ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      return list;
    }

    /* Lucide leaves icon names it doesn't know untouched; give those a neutral box instead of a blank tile */
    function refreshIcons() {
      if (!(window.lucide && lucide.createIcons)) return;
      lucide.createIcons();
      var left = document.querySelectorAll('i[data-lucide]');
      if (left.length) {
        Array.prototype.forEach.call(left, function (n) { n.setAttribute('data-lucide', 'box'); });
        lucide.createIcons();
      }
    }

    /* ---------- cards ---------- */
    function renderProjects(links) {
      var grid = $('bento-grid');
      grid.innerHTML = links.map(function (p, i) {
        var tint = TINTS[i % TINTS.length];
        var cat = catInfo(p.category);
        var icon = p.icon || cat.icon;

        var tagsHtml = p.tags.map(function (tag, ti) {
          return '<li class="tag"><span class="tag-dot" style="--dot:' + TINTS[ti % TINTS.length] + ';"></span>' + escapeHtml(tag) + '</li>';
        }).join('');

        /* "status": "Apk released" / "Currently building" ... -> indicator light + text */
        var statusHtml = '';
        var st = p.status ? parseLed(p.status) : null;
        if (st && st.text) {
          var tone = statusTone(st.text);
          statusHtml = '<span class="chip chip-status' + (tone === 'building' ? ' is-building' : '') + '" style="--led:' + (st.color || TONE_COLORS[tone]) + ';">' +
            '<span class="led" aria-hidden="true"></span>' + escapeHtml(st.text) + '</span>';
        }

        var fallback = '<div class="logo-fallback" style="display:' + (p.logo ? 'none' : 'flex') + '; --tint:' + tint + ';"><i data-lucide="' + escapeHtml(icon) + '" class="ico"></i></div>';
        var logoHtml = p.logo
          ? '<img src="' + escapeHtml(p.logo) + '" alt="' + escapeHtml(p.title) + ' logo" class="logo-img" decoding="async" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';" />' + fallback
          : fallback;

        var external = /^mailto:/i.test(p.url) ? '' : ' target="_blank" rel="noopener noreferrer"';

        return (
          '<article class="project-card' + (!p.description && !tagsHtml ? ' is-bare' : '') + '" style="--i:' + i + ';" data-category="' + escapeHtml(p.category) + '">' +
            '<div class="card">' +
              '<div class="card-top">' +
                '<div class="logo-well">' + logoHtml + '</div>' +
                '<div class="card-meta">' +
                  '<span class="chip"><i data-lucide="' + escapeHtml(cat.icon) + '" class="ico"></i>' + escapeHtml(cat.label) + '</span>' +
                  statusHtml +
                '</div>' +
              '</div>' +
              '<h3 class="card-title">' + escapeHtml(p.title) + '</h3>' +
              (p.description ? '<p class="card-desc">' + escapeHtml(p.description) + '</p>' : '') +
              (tagsHtml ? '<ul class="tags">' + tagsHtml + '</ul>' : '') +
              '<a href="' + escapeHtml(p.url) + '"' + external + ' class="btn press">' +
                '<span>' + escapeHtml(linkLabel(p.url)) + '</span><i data-lucide="arrow-up-right" class="ico"></i>' +
              '</a>' +
            '</div>' +
          '</article>'
        );
      }).join('');
    }

    /* Placeholder cards with the same shape, shown while the list is on its way */
    function skeletonCard() {
      return (
        '<article class="project-card is-skeleton" aria-hidden="true"><div class="card">' +
          '<div class="card-top">' +
            '<div class="logo-well"><div class="sk sk-logo"></div></div>' +
            '<div class="card-meta"><span class="sk sk-chip"></span><span class="sk sk-chip wide"></span></div>' +
          '</div>' +
          '<div class="sk sk-title"></div>' +
          '<div class="sk sk-line"></div><div class="sk sk-line short"></div>' +
          '<div class="sk-tags"><span class="sk sk-tag"></span><span class="sk sk-tag"></span><span class="sk sk-tag"></span></div>' +
          '<div class="sk sk-btn"></div>' +
        '</div></article>'
      );
    }

    /* ---------- Profile (name, tagline, socials) ---------- */
    var DATA = JSON.parse(document.getElementById('site-data').textContent);
    renderProfile(DATA.profile);

    var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- Theme switch ---------- */
    var rootEl = document.documentElement;
    var themeBtn = document.getElementById('theme-toggle');
    var metaTheme = document.getElementById('meta-theme-color');

    function setTheme(theme, save) {
      rootEl.classList.add('theme-switching');
      rootEl.setAttribute('data-theme', theme);
      if (metaTheme) metaTheme.setAttribute('content', theme === 'dark' ? '#1f232b' : '#e4e9f1');
      if (themeBtn) themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
      if (save) { try { localStorage.setItem('theme', theme); } catch (e) {} }
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { rootEl.classList.remove('theme-switching'); });
      });
    }
    setTheme(rootEl.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false);
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        setTheme(rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
      });
    }


    /* ==================================================================
       PAGE STATE
       ================================================================== */
    var state = { links: [], filter: 'all' };
    var loading = false, hasRendered = false, lastSig = '';

    var grid = $('bento-grid');
    var filtersBar = $('filters');
    var seg = $('filter-seg');
    var noteEl = $('load-note');
    var errorEl = $('load-error');
    var emptyEl = $('empty-state');
    var NOTE_TEXT = $('note-text').textContent;

    function announce(text) { $('load-status').textContent = text; }

    /* ---------- Filter tabs (built from the categories that exist) ---------- */
    function filterButtons() { return seg.querySelectorAll('.filter-btn'); }

    /* The raised thumb sits under whichever tab is active */
    function placeThumb(instant) {
      var active = seg.querySelector('.filter-btn.tab-active');
      if (!active) return;
      if (instant) seg.classList.remove('ready');
      seg.style.setProperty('--x', active.offsetLeft + 'px');
      seg.style.setProperty('--w', active.offsetWidth + 'px');
      if (instant) { void seg.offsetWidth; seg.classList.add('ready'); }
    }
    /* Re-measure whenever the tabs change size (web font arrives, rotate, zoom, resize) */
    var thumbObserver = window.ResizeObserver ? new ResizeObserver(function () { placeThumb(true); }) : null;
    if (!thumbObserver) window.addEventListener('resize', function () { placeThumb(true); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { placeThumb(true); });
    requestAnimationFrame(function () { seg.classList.add('ready'); });

    function buildFilters(cats) {
      Array.prototype.forEach.call(filterButtons(), function (b) { b.parentNode.removeChild(b); });
      var html = '<button type="button" data-filter="all" aria-pressed="false" class="filter-btn seg-btn"><i data-lucide="layout-grid" class="ico"></i><span class="lbl-long">All Projects</span><span class="lbl-short">All</span></button>';
      cats.forEach(function (c) {
        var info = catInfo(c);
        html += '<button type="button" data-filter="' + escapeHtml(c) + '" aria-pressed="false" class="filter-btn seg-btn"><i data-lucide="' + escapeHtml(info.icon) + '" class="ico"></i>' + escapeHtml(info.plural) + '</button>';
      });
      seg.insertAdjacentHTML('beforeend', html);
      show(filtersBar, cats.length > 1);          /* one category only: nothing to filter */
      if (thumbObserver) {
        thumbObserver.disconnect();
        thumbObserver.observe(seg);
        Array.prototype.forEach.call(filterButtons(), function (b) { thumbObserver.observe(b); });
      }
    }

    function setActiveTab(filter) {
      Array.prototype.forEach.call(filterButtons(), function (b) {
        var on = b.getAttribute('data-filter') === filter;
        b.classList.toggle('tab-active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    function applyFilter(filter, instant) {
      var cards = grid.querySelectorAll('.project-card[data-category]');
      Array.prototype.forEach.call(cards, function (card) {
        var isMatch = filter === 'all' || card.getAttribute('data-category') === filter;
        clearTimeout(card._hideTimeout);
        if (instant) {
          card.style.display = isMatch ? '' : 'none';
          card.style.opacity = '';
          card.style.transform = '';
          return;
        }
        if (isMatch) {
          card.style.display = '';
          void card.offsetWidth;                  /* force reflow so the transition plays */
          card.style.opacity = '1';
          card.style.transform = 'scale(1)';
        } else {
          card.style.opacity = '0';
          card.style.transform = 'scale(0.94)';
          card._hideTimeout = setTimeout(function () { card.style.display = 'none'; }, 300);
        }
      });
    }

    seg.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('.filter-btn') : null;
      if (!btn) return;
      state.filter = btn.getAttribute('data-filter');
      setActiveTab(state.filter);
      placeThumb(false);
      if (filtersBar.scrollWidth > filtersBar.clientWidth) {
        btn.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
      }
      applyFilter(state.filter, false);
    });

    /* ---------- Stats ---------- */
    var projectCountEl = $('project-count-stat');
    var openSourceEl = $('open-source-stat');
    var gaugeEl = $('open-source-gauge');

    function animateCounter(el) {
      el._animated = true;
      var card = el.closest('.stat');
      if (card) card.classList.add('is-in');
      if (prefersReducedMotion) { el.textContent = el.getAttribute('data-count-to'); return; }
      var duration = 1100, startTime = null;
      function tick(now) {
        if (!startTime) startTime = now;
        var target = parseInt(el.getAttribute('data-count-to'), 10) || 0;   /* read live: the number may change mid-animation */
        var progress = Math.min((now - startTime) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(eased * target);
        if (progress < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    var counterObserver = null;
    if ('IntersectionObserver' in window) {
      counterObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { animateCounter(entry.target); counterObserver.unobserve(entry.target); }
        });
      }, { threshold: 0.4 });
    }

    /* Counts up when its card scrolls into view; later changes just swap the number */
    function setCounter(el, n) {
      if (!el) return;
      el.setAttribute('data-count-to', n);
      if (el._animated) { el.textContent = n; return; }
      if (el._armed) return;
      el._armed = true;
      if (counterObserver) counterObserver.observe(el); else animateCounter(el);
    }

    /* Projects still being built (or only planned) are not "shipped" yet; no status = shipped */
    function shippedCount(links) {
      return links.filter(function (p) {
        if (!p.status) return true;
        var tone = statusTone(parseLed(p.status).text);
        return tone !== 'building' && tone !== 'planned';
      }).length;
    }

    var openSourcePct = 100;
    if (DATA.stats && DATA.stats.openSourcePercent != null) openSourcePct = Math.max(0, Math.min(100, Number(DATA.stats.openSourcePercent) || 0));
    if (gaugeEl) gaugeEl.style.setProperty('--pct', openSourcePct + '%');
    setCounter(openSourceEl, openSourcePct);

    /* ==================================================================
       LOADING FROM GOOGLE APPS SCRIPT
       ================================================================== */
    var ERRORS = {
      config:  { title: "Projects aren't connected yet", text: 'Open index.html and replace YOUR_APPS_SCRIPT_URL with your Google Apps Script web-app address.', retry: false },
      timeout: { title: 'That took too long', text: "The project list didn't answer in time. Check your connection and try again.", retry: true },
      network: { title: "Couldn't load the projects", text: "You may be offline, or the server can't be reached right now. Check your connection and try again.", retry: true },
      server:  { title: "Couldn't read the project list", text: 'The server sent back something unexpected. Please try again in a moment.', retry: true }
    };

    function loadError(kind, detail) {
      var e = new Error(detail || kind);
      e.kind = kind;
      return e;
    }

    function isConfigured() {
      var u = String(APPS_SCRIPT_URL || '').trim();
      return /^https:\/\//i.test(u) && u.indexOf('YOUR_APPS_SCRIPT_URL') === -1;
    }

    /* A plain GET with no custom headers, so the browser needs no CORS pre-flight (Apps Script can't answer one) */
    function fetchLinks() {
      return new Promise(function (resolve, reject) {
        var ctrl = window.AbortController ? new AbortController() : null;
        var timedOut = false;
        var timer = setTimeout(function () {
          timedOut = true;
          if (ctrl) ctrl.abort(); else reject(loadError('timeout'));
        }, FETCH_TIMEOUT_MS);

        fetch(String(APPS_SCRIPT_URL).trim(), ctrl ? { signal: ctrl.signal } : undefined)
          .then(function (res) {
            if (!res.ok) throw loadError('server', 'HTTP ' + res.status);
            return res.text();
          })
          .then(function (text) {
            var data;
            try { data = JSON.parse(text); }
            catch (e) { throw loadError('server', 'The response was not JSON (is the deployment set to "Anyone"?): ' + text.slice(0, 120)); }
            var list = Array.isArray(data) ? data : (data && data.ok !== false && Array.isArray(data.links) ? data.links : null);
            if (!list) throw loadError('server', (data && data.error) || 'Unexpected response shape');
            clearTimeout(timer);
            resolve(list.map(normalizeLink).filter(Boolean));
          })
          .catch(function (err) {
            clearTimeout(timer);
            reject(timedOut ? loadError('timeout') : (err && err.kind ? err : loadError('network', err && err.message)));
          });
      });
    }

    /* The last good list stays in the browser: repeat visits show it at once and refresh quietly behind it */
    function readCache() {
      try {
        var o = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        return o && Array.isArray(o.links) ? o.links.map(normalizeLink).filter(Boolean) : null;
      } catch (e) { return null; }
    }
    function writeCache(links) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), links: links })); } catch (e) {}
    }

    function showSkeleton() {
      show(errorEl, false); show(noteEl, false); show(emptyEl, false); show(filtersBar, false);
      grid.innerHTML = skeletonCard() + skeletonCard();
      grid.setAttribute('aria-busy', 'true');
      announce('Loading projects…');
    }

    function showError(kind) {
      var e = own(ERRORS, kind) ? ERRORS[kind] : ERRORS.network;
      grid.innerHTML = '';
      grid.setAttribute('aria-busy', 'false');
      show(filtersBar, false); show(emptyEl, false); show(noteEl, false);
      $('err-title').textContent = e.title;
      $('err-text').textContent = e.text;
      show($('err-retry'), e.retry);
      show(errorEl, true);
      announce(e.title + '.');
    }

    function renderAll(links) {
      state.links = links;
      var cats = categoriesOf(links);
      if (state.filter !== 'all' && cats.indexOf(state.filter) === -1) state.filter = 'all';

      buildFilters(cats);
      renderProjects(links);
      refreshIcons();                              /* icons must be created AFTER the dynamic markup exists */
      setActiveTab(state.filter);
      applyFilter(state.filter, true);
      placeThumb(true);
      setCounter(projectCountEl, shippedCount(links));

      show(errorEl, false);
      show(emptyEl, links.length === 0);
      grid.setAttribute('aria-busy', 'false');
      announce(links.length === 0 ? 'No projects yet.' : 'Loaded ' + links.length + (links.length === 1 ? ' project.' : ' projects.'));
    }

    function setBusyUi(on) {
      ['err-retry', 'note-retry'].forEach(function (id) {
        var b = $(id);
        b.classList.toggle('is-loading', on);
        b.disabled = on;
      });
      $('note-text').textContent = on ? 'Refreshing…' : NOTE_TEXT;
    }

    function load() {
      if (loading) return;
      loading = true;
      setBusyUi(true);
      if (!hasRendered) showSkeleton();

      fetchLinks().then(function (links) {
        writeCache(links);
        var sig = JSON.stringify(links);
        if (!hasRendered || sig !== lastSig) renderAll(links);
        lastSig = sig;
        hasRendered = true;
        show(noteEl, false);
        show(errorEl, false);
      }).catch(function (err) {
        console.error('[linktree] could not load the project list:', err);
        if (hasRendered) { show(noteEl, true); announce("Couldn't refresh the projects."); }
        else showError(err && err.kind);
      }).then(function () {
        loading = false;
        setBusyUi(false);
      });
    }

    $('err-retry').addEventListener('click', load);
    $('note-retry').addEventListener('click', load);

    /* ---------- Go ---------- */
    refreshIcons();                                /* static icons: theme button, avatar fallback, socials, notices */
    if (!isConfigured()) {
      showError('config');
    } else {
      var cached = readCache();
      if (cached && cached.length) {               /* instant paint from the last visit, then refresh behind it */
        renderAll(cached);
        hasRendered = true;
        lastSig = JSON.stringify(cached);
      }
      load();
    }
  </script>
</body>
</html>
